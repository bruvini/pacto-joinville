name: Validar Encontro de Contas
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/eletivas/**'
      - 'src/components/eletivas/**'
      - 'src/routes/_authenticated/eletivas.**'
      - 'src/integrations/supabase/types.ts'
      - 'supabase/functions/_shared/eletivas-**'
      - 'supabase/migrations/*eletivas*'
      - 'supabase/tests/*eletivas*'
      - 'public/homologacao/**'
      - '.github/workflows/eletivas-validacao.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Dependências
        run: bun install --frozen-lockfile
      - name: Arquitetura (projeto completo)
        run: npm run check:architecture
      - name: Testes (projeto completo)
        run: npm run test
      - name: Sintaxe SQL — migrations e verificação RLS
        run: |
          python -m pip install --quiet pglast
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          roots=[Path("supabase/migrations"),Path("supabase/tests")]
          arquivos=sorted([p for root in roots for p in root.glob("*eletivas*.sql")])
          if not any("fase7_homologacao" in str(p) for p in arquivos):
              raise SystemExit("Script SQL/RLS Fase 7 ausente.")
          for arquivo in arquivos:
              parse_sql(arquivo.read_text(encoding="utf-8"))
              print("SQL válido:", arquivo)
          PY
      - name: Garantir fallback local (Edge não é dependência)
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const code=fs.readFileSync('src/lib/eletivas/processarLocal.ts','utf8');
          if(!code.includes('conciliarEletivas(normalizados)') ||
             code.includes('functions.invoke(')){
            throw Error('Motor local indisponível ou dependência Edge inesperada.');
          }
          console.log('Motor do navegador disponível; sem chamada obrigatória a Edge.');
          JS
      - name: Compilação (projeto completo)
        run: npm run build
  smoke-deploy:
    needs: validar
    runs-on: ubuntu-latest
    if: ${{ vars.LOVABLE_PUBLIC_URL != '' }}
    steps:
      - name: Smoke HTTP da URL publicada configurada
        env:
          LIVE_URL: ${{ vars.LOVABLE_PUBLIC_URL }}
        run: |
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 5 --connect-timeout 15 \
            --max-time 45 --output /dev/null "$LIVE_URL"
          echo "Endpoint público responde HTTP 2xx; versão publicada requer conferência do SHA no Lovable."

name: Validar Encontro de Contas
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/eletivas/**'
      - 'src/components/eletivas/**'
      - 'src/routes/_authenticated/eletivas.**'
      - 'src/integrations/supabase/types.ts'
      - 'supabase/functions/_shared/eletivas-**'
      - 'supabase/migrations/*eletivas*'
      - 'supabase/tests/*eletivas*'
      - '.github/workflows/eletivas-validacao.yml'
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Dependências
        run: bun install --frozen-lockfile
      - name: Contratos arquiteturais
        run: bun run check:architecture
      - name: Testes automatizados
        run: bunx vitest run src/lib/eletivas
      - name: Sintaxe PostgreSQL das migrations Eletivas
        run: |
          python -m pip install --quiet pglast
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          for arquivo in sorted(Path("supabase/migrations").glob("*eletivas*.sql")):
              parse_sql(arquivo.read_text(encoding="utf-8"))
              print("SQL válido:", arquivo)
          PY
      - name: Compilação
        run: bun run build

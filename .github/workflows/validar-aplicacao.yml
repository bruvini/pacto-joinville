name: Validar código, testes e build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Executar testes
        run: bun run test
      - name: Validar build e contratos
        if: always()
        run: bun run build
